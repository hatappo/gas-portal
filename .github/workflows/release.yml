name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          JS
      - run: npm ci
      - run: npm run check
      - name: Pack compiled assets
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          path: release/gas-portal-*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "release/gas-portal-${RELEASE_TAG#v}.tgz" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
